<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 绿色简约线条，无填充背景，锥形与环绕环 -->
    <g fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 锥形（顶点朝上，底边为凹） -->
        <path d="M 50 20 L 20 75 Q 50 60 80 75 Z" />
        
        <!-- 环绕锥形的椭圆环 -->
        <ellipse cx="50" cy="55" rx="36" ry="12" />
        
    </g>
</svg>