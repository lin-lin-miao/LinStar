<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 绿色简约线条，无填充背景，电池图标 -->
    <g fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 顶部正极凸起 -->
        <rect x="42" y="15" width="16" height="10" rx="2" />
        
        <!-- 电池主体（圆角矩形） -->
        <rect x="30" y="25" width="40" height="65" rx="5" />
        
        <!-- 内部电量指示线（三条水平线） -->
        <line x1="35" y1="40" x2="65" y2="40" />
        <line x1="35" y1="55" x2="65" y2="55" />
        <line x1="35" y1="70" x2="65" y2="70" />
        
        <!-- 顶部正极符号 '+' -->
        <line x1="47" y1="20" x2="53" y2="20" />
        <line x1="50" y1="17" x2="50" y2="23" />
        
    </g>
</svg>