<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <g fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 倒几字形舱体（开口朝上的U形发射架） -->
        <path d="M 25 80 H 75" />
        <path d="M 25 80 V 20" />
        <path d="M 75 80 V 20" />
        <line x1="15" y1="20" x2="25" y2="20" />
        <line x1="75" y1="20" x2="85" y2="20" />
        <line x1="15" y1="50" x2="25" y2="50" />
        <line x1="75" y1="50" x2="85" y2="50" />

        <!-- 火箭弹主体（矩形身体） -->
        <rect x="42" y="25" width="16" height="35" />

        <!-- 火箭弹头部（正三角形） -->
        <path d="M 42 25 L 50 10 L 58 25 Z" />

        <!-- 火箭弹身体细节 / 分段线 -->
        <line x1="42" y1="35" x2="58" y2="35" />
        <line x1="42" y1="45" x2="58" y2="45" />

        <!-- 火箭弹尾部稳定翼 -->
        <path d="M 42 60 L 38 65 L 42 65" />
        <path d="M 58 60 L 62 65 L 58 65" />
    </g>
</svg>