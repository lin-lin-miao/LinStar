<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 绿色简约线条，无填充背景，圆柱体与三个环绕环 -->
    <g fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 圆柱体 -->
        <!-- 顶部椭圆 -->
        <ellipse cx="50" cy="25" rx="16" ry="6" />
        <!-- 底部椭圆 -->
        <ellipse cx="50" cy="75" rx="16" ry="6" />
        <!-- 左侧竖线 -->
        <line x1="34" y1="25" x2="34" y2="75" />
        <!-- 右侧竖线 -->
        <line x1="66" y1="25" x2="66" y2="75" />

        <!-- 三个环绕环（水平椭圆，环绕圆柱） -->
        <!-- 上环 -->
        <ellipse cx="50" cy="38" rx="24" ry="7" />
        <!-- 中环 -->
        <ellipse cx="50" cy="50" rx="26" ry="8" />
        <!-- 下环 -->
        <ellipse cx="50" cy="62" rx="24" ry="7" />
        
    </g>
</svg>