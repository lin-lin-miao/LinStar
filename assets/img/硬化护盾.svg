<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 蓝色简约线条，无填充背景，正圆形护盾 -->
    <g fill="none" stroke="#00A8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 左侧圆弧 -->
        <path d="M 38 20 A 30 30 0 0 0 38 80" />
        
        <!-- 右侧圆弧 -->
        <path d="M 62 20 A 30 30 0 0 1 62 80" />
        <g fill="#00A8FF">
        <!-- 中心护盾形状（上平下尖，经典盾牌轮廓） -->
        <path d="M 38 36 H 62 V 60 L 50 70 L 38 60 Z" />
        </g>
    </g>
</svg>