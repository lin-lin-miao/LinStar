<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 红色简约线条，无填充背景，三个火炮并排 -->
    <g fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 左侧火炮 -->
        <rect x="12" y="25" width="16" height="45" />
        <path d="M10 25 H30 V15 H10 Z" />
        <path d="M10 15 H30" />
        <path d="M5 70 H35 V90 H5 Z" />
        <line x1="15" y1="80" x2="25" y2="80" />
        <line x1="12" y1="40" x2="28" y2="40" />
        <line x1="12" y1="55" x2="28" y2="55" />

        <!-- 中间火炮 -->
        <rect x="42" y="25" width="16" height="45" />
        <path d="M40 25 H60 V15 H40 Z" />
        <path d="M40 15 H60" />
        <path d="M35 70 H65 V90 H35 Z" />
        <line x1="45" y1="80" x2="55" y2="80" />
        <line x1="42" y1="40" x2="58" y2="40" />
        <line x1="42" y1="55" x2="58" y2="55" />

        <!-- 右侧火炮 -->
        <rect x="72" y="25" width="16" height="45" />
        <path d="M70 25 H90 V15 H70 Z" />
        <path d="M70 15 H90" />
        <path d="M65 70 H95 V90 H65 Z" />
        <line x1="75" y1="80" x2="85" y2="80" />
        <line x1="72" y1="40" x2="88" y2="40" />
        <line x1="72" y1="55" x2="88" y2="55" />
        
    </g>
</svg>