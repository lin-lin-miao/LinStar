<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 绿色简约线条，无填充背景，倾斜圆柱体与环绕圆环 -->
    <g fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 整体向右倾斜45度，以画布中心为轴 -->
        <g transform="rotate(45 50 50)">
            
            <!-- 圆柱体主体 -->
            <!-- 顶部椭圆 -->
            <ellipse cx="50" cy="25" rx="15" ry="6" />
            <!-- 底部椭圆 -->
            <ellipse cx="50" cy="75" rx="15" ry="6" />
            <!-- 左侧竖线 -->
            <line x1="35" y1="25" x2="35" y2="75" />
            <!-- 右侧竖线 -->
            <line x1="65" y1="25" x2="65" y2="75" />

            <!-- 环绕圆柱体的两个圆环 -->
            <!-- 上环 -->
            <ellipse cx="50" cy="38" rx="22" ry="8" />
            <!-- 下环 -->
            <ellipse cx="50" cy="62" rx="22" ry="8" />

            <!-- 从圆柱体中心沿中轴向上延伸的线 -->
            <line x1="50" y1="50" x2="50" y2="5" />
            
            <!-- 发射点（中心小圆点） -->
            <circle cx="50" cy="50" r="2" fill="#00FF88" stroke="none" />
            
        </g>

    </g>
</svg>