<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 蓝色简约线条，无填充背景，循环护盾 -->
    <g fill="none" stroke="#00A8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 左侧圆弧 -->
        <path d="M 38 20 A 30 30 0 0 0 38 80" />
        <!-- 左侧顶部箭头（指向右，形成循环） -->
        <path d="M 38 20 L 46 20 L 38 28" />

        <!-- 右侧圆弧 -->
        <path d="M 62 20 A 30 30 0 0 1 62 80" />
        <!-- 右侧底部箭头（指向左，形成循环） -->
        <path d="M 62 80 L 54 80 L 62 72" />
        
        <!-- 中心能量核心 -->
        <circle cx="50" cy="50" r="20" />
        
    </g>
</svg>