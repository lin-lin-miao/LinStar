<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 红色简约线条，无填充背景，爆炸图标 -->
    <g fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 中心点（实心红点） -->
        <circle cx="50" cy="50" r="4" fill="#FF3B30" stroke="none" />

        <!-- 8条辐条（从中心向外放射） -->
        <!-- 正上 -->
        <line x1="50" y1="42" x2="50" y2="22" />
        <!-- 右上 45° -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(45 50 50)" />
        <!-- 正右 -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(90 50 50)" />
        <!-- 右下 135° -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(135 50 50)" />
        <!-- 正下 -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(180 50 50)" />
        <!-- 左下 225° -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(225 50 50)" />
        <!-- 正左 -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(270 50 50)" />
        <!-- 左上 315° -->
        <line x1="50" y1="42" x2="50" y2="22" transform="rotate(315 50 50)" />

        <line x1="50" y1="18" x2="50" y2="12" />
        <!-- 右上 45° -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(45 50 50)" />
        <!-- 正右 -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(90 50 50)" />
        <!-- 右下 135° -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(135 50 50)" />
        <!-- 正下 -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(180 50 50)" />
        <!-- 左下 225° -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(225 50 50)" />
        <!-- 正左 -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(270 50 50)" />
        <!-- 左上 315° -->
        <line x1="50" y1="18" x2="50" y2="12" transform="rotate(315 50 50)" />
        
    </g>
</svg>