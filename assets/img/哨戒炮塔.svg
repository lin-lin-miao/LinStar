<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 无人机类棕（#b07a4a）实心正六边形底盘，无填充背景，哨戒炮塔 -->
    <polygon points="14,50 32,18.8 68,18.8 86,50 68,81.2 32,81.2" fill="#b07a4a" stroke="#7d5433" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 炮管（自顶边向上伸出的炮管口） -->
    <rect x="45" y="20" width="10" height="25" fill="#e0b58f" stroke="#7d5433" stroke-width="2" stroke-linejoin="round"/>

    <!-- 炮塔基座 + 转轴 -->
    <circle cx="50" cy="58" r="13" fill="#8a5c34"/>
    <circle cx="50" cy="58" r="5" fill="#f2d4ba"/>

    <!-- 警戒纹样（左右哨戒 V 形） -->
    <path d="M 30 50 L 37 57 L 30 64" fill="none" stroke="#f2d4ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 70 50 L 63 57 L 70 64" fill="none" stroke="#f2d4ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
