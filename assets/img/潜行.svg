<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 绿色简约线条，无填充背景，左半锥形+右侧消散 -->
    <g fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 锥形左半边（顶点朝上，底边为凹） -->
        <path d="M 50 20 L 20 75 Q 50 60 50 67.5" />
        
        <!-- 右侧消散线条（从锥形右边缘向外逐渐变短、变疏） -->
        <!-- 靠近顶部区域 -->
        <line x1="53" y1="24" x2="62" y2="21" />
        <line x1="56" y1="31" x2="67" y2="29" />
        
        <!-- 中上部 -->
        <line x1="59" y1="39" x2="72" y2="39" />
        <line x1="63" y1="48" x2="78" y2="50" />
        
        <!-- 中下部 -->
        <line x1="67" y1="57" x2="82" y2="62" />
        <line x1="71" y1="65" x2="85" y2="72" />
        
        <!-- 底边附近消散 -->
        <line x1="66" y1="70" x2="76" y2="77" />
        
    </g>
</svg>