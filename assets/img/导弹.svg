<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- 红色简约线条，无填充背景，独立导弹个体（向右倾斜45度） -->
    <g fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- 整体旋转组，以画布中心(50,50)为圆心顺时针旋转45度 -->
        <g transform="rotate(45 50 50)">
            <!-- 导弹头部（正三角形，更大） -->
            <path d="M 38 25 L 50 5 L 62 25 Z" />

            <!-- 导弹主体（矩形，更粗更长） -->
            <rect x="38" y="25" width="24" height="45" />

            <!-- 导弹主体分段/环带细节（体现科技质感） -->
            <line x1="38" y1="38" x2="62" y2="38" />
            <line x1="38" y1="50" x2="62" y2="50" />
            <line x1="38" y1="62" x2="62" y2="62" />

            <!-- 导弹尾翼（等比放大，向两侧张开） -->
            <path d="M 38 70 L 32 74 L 38 74 Z" />
            <path d="M 62 70 L 68 74 L 62 74 Z" />
            
            <!-- 导弹尾部喷口细节 -->
            <line x1="44" y1="74" x2="56" y2="74" />
        </g>

    </g>
</svg>